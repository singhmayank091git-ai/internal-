<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 76" fill="none">
  <defs>
    <!-- Cyan to Teal Aqua Gradient for BRIDGE -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#14E2D0" />
      <stop offset="100%" stop-color="#26EBA6" />
    </linearGradient>

    <!-- Circuit Trace Gradients -->
    <linearGradient id="trace1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#26EBA6" />
    </linearGradient>
    <linearGradient id="trace2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="40%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Glowing Flare at Bridge Junction -->
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="20%" stop-color="#A5F3FC" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .tech-font {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 2px;
    }
  </style>

  <!-- SKILL in Crisp White -->
  <g fill="#FFFFFF">
    <!-- S -->
    <path d="M 46 22 C 46 17 41 14 33 14 H 22 C 14 14 9 18 9 25 C 9 32 14 36 24 38 L 33 40 C 41 41 46 44 46 51 C 46 58 41 62 31 62 H 19 C 11 62 6 57 6 50 H 16 C 16 53 19 55 23 55 H 31 C 36 55 38 53 38 49 C 38 44 34 42 26 40 L 17 38 C 9 36 4 32 4 25 C 4 17 10 14 20 14 H 32 C 42 14 46 18 46 22 Z" />
    
    <!-- K -->
    <path d="M 54 14 H 63 V 33 L 79 14 H 91 L 73 34 L 92 62 H 80 L 65 39 L 63 41 V 62 H 54 V 14 Z" />

    <!-- I -->
    <path d="M 99 14 H 108 V 62 H 99 V 14 Z" />

    <!-- L -->
    <path d="M 116 14 H 125 V 54 H 146 V 62 H 116 V 14 Z" />

    <!-- L -->
    <path d="M 152 14 H 161 V 54 H 182 V 62 H 152 V 14 Z" />
  </g>

  <!-- Circuit Trace Bridge -->
  <g id="circuit" transform="translate(196, 0)">
    <!-- Cyan Halo Glow -->
    <circle cx="86" cy="38" r="32" fill="url(#flare)" />

    <!-- Trace 1 (Top-most) -->
    <path d="M 4 23 H 26 C 42 23 54 52 70 52 H 88" stroke="url(#trace1)" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="4" cy="23" r="3.5" fill="#0284C7" />

    <!-- Trace 2 (Upper mid) -->
    <path d="M 22 30 H 38 C 52 30 60 44 74 44 H 92" stroke="url(#trace2)" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="22" cy="30" r="3" fill="#0EA5E9" />

    <!-- Trace 3 (Lower mid) -->
    <path d="M 2 44 H 24 C 40 44 52 30 68 30 H 88" stroke="url(#trace2)" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="2" cy="44" r="3" fill="#0284C7" />

    <!-- Trace 4 (Bottom-most) -->
    <path d="M 16 53 H 32 C 48 53 58 23 76 23 H 90" stroke="url(#trace1)" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="16" cy="53" r="3.5" fill="#0284C7" />

    <!-- Right End Nodes into B -->
    <circle cx="88" cy="23" r="3.2" fill="#00F0FF" />
    <circle cx="88" cy="30" r="2.8" fill="#2DD4BF" />
    <circle cx="92" cy="44" r="2.8" fill="#2DD4BF" />
    <circle cx="88" cy="52" r="3.2" fill="#00F0FF" />

    <!-- Bright Center Lens Flare Spark -->
    <circle cx="86" cy="38" r="6" fill="#FFFFFF" filter="url(#neonGlow)" />
    <circle cx="86" cy="38" r="3" fill="#E0FFFF" />
  </g>

  <!-- BRIDGE in Glowing Cyan-Teal -->
  <g fill="url(#bridgeGrad)" filter="url(#neonGlow)">
    <!-- B -->
    <path d="M 292 14 H 318 C 326 14 332 17 332 24 C 332 29 328 33 322 35 C 329 37 334 42 334 49 C 334 57 327 62 317 62 H 292 V 14 Z M 301 22 V 34 H 315 C 320 34 323 32 323 28 C 323 24 320 22 315 22 H 301 Z M 301 41 V 54 H 316 C 321 54 324 51 324 47 C 324 43 321 41 316 41 H 301 Z" />

    <!-- R -->
    <path d="M 342 14 H 368 C 376 14 382 18 382 26 C 382 32 377 36 371 37 L 384 62 H 373 L 361 39 H 351 V 62 H 342 V 14 Z M 351 22 V 32 H 366 C 371 32 373 30 373 27 C 373 24 371 22 366 22 H 351 Z" />

    <!-- I -->
    <path d="M 390 14 H 399 V 62 H 390 V 14 Z" />

    <!-- D -->
    <path d="M 407 14 H 427 C 439 14 447 22 447 38 C 447 54 439 62 427 62 H 407 V 14 Z M 416 22 V 54 H 426 C 433 54 438 48 438 38 C 438 28 433 22 426 22 H 416 Z" />

    <!-- G -->
    <path d="M 480 25 H 471 C 471 19 467 17 460 17 C 450 17 444 24 444 38 C 444 52 450 59 460 59 C 468 59 471 55 471 49 H 461 V 42 H 480 V 53 C 478 60 472 65 460 65 C 445 65 436 54 436 38 C 436 22 445 11 460 11 C 473 11 479 17 480 25 Z" />

    <!-- E -->
    <path d="M 488 14 H 518 V 22 H 497 V 34 H 515 V 42 H 497 V 54 H 518 V 62 H 488 V 14 Z" />
  </g>
</svg>